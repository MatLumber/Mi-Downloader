name: Release

# Manual / tag-driven path. Use this to re-cut a release for an existing tag
# without pushing to master (which auto-tag.yml would turn into a new version).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.20)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    permissions:
      contents: write
