name: Auto Tag

# Every push to master/main bumps the patch version, tags it, and ships a
# release. The guards below stop the bot's own release commit from re-triggering
# the loop.

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  tag:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        id: bump
        run: |
          node .github/scripts/bump-version.js >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag v${{ steps.bump.outputs.version }}
          git push origin HEAD:${{ github.ref_name }} --tags

  # The Windows build lives in build-release.yml so this workflow and release.yml
  # cannot drift apart — a divergence there ships a broken update to everyone.
  build-release:
    needs: tag
    if: ${{ needs.tag.outputs.version != '' }}
    uses: ./.github/workflows/build-release.yml
    with:
      ref: v${{ needs.tag.outputs.version }}
    permissions:
      contents: write
